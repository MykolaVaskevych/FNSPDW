[project]
name = "fnspdw"
version = "0.1.0"
description = "Encrypted traffic analysis and shaping defences"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
]

# Nothing here is installed as a library yet, so there is no build backend and
# no src layout. One venv at the root; each experiment runs from its own folder.
[tool.uv]
package = false
